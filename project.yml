name: tvbox
options:
  bundleIdPrefix: com.tvbox
  xcodeVersion: "15.0"
  groupSortPosition: top
  minimumXcodeGenVersion: "2.35"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: WP3M36TK8M
    CODE_SIGN_STYLE: Automatic

packages:
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: 3.6.0

targets:
  tvbox:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - package: VLCKitSPM
        product: VLCKitSPM
    sources:
      - path: tvbox
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.appinstall.nov.carbon.lam
        INFOPLIST_FILE: tvbox/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.4"
        PRODUCT_NAME: TVBox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        # VLCKit 3.6 的 XCFramework 不含 Mac Catalyst 切片；macOS 请使用原生 tvbox-macOS target。
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  # 唯一的单元测试 target：所有测试源码都放在 tvboxTests/，每个测试只执行一次。
  tvboxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: tvbox
    sources:
      - path: tvboxTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tvbox.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TVBox.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TVBox"
        BUNDLE_LOADER: "$(TEST_HOST)"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  tvbox-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    dependencies:
      - package: VLCKitSPM
        product: VLCKitSPM
    sources:
      - path: tvbox
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tvbox.app.macos
        INFOPLIST_FILE: tvbox/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.4"
        PRODUCT_NAME: TVBox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: tvbox/tvbox-macOS.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
